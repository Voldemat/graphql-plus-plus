[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3.6"
chrono = { version = "0.4.44", default-features = false }
clap = { version = "4.6.5", features = ["derive", "std", "help"], default-features = false }
codeform = { version = "0.0.6" }
console = "0.16.4"
futures-core = { version = "0.3.32", default-features = false }
futures-util = { version = "0.3.32", default-features = false }
glob = "0.3.3"
indexmap = { version = "2.13.0", features = ["std"], default-features = false }
jsonrpc = { version = "0.20.1", default-features = false }
jsonrpc-core = { version = "18.0.0", default-features = false }
libgql = { path = "../libgql", features = ["formatter", "parsers", "json-serializers-schema", "json-parsers-schema-server", "json-parsers-introspection"] }
lsp-types = { version = "0.97.0", default-features = false }
reqwest = { version = "0.13.2", default-features = false, features = ["blocking"] }
serde = { version = "1.0.228", features = ["rc"], default-features = false }
serde_json = { version = "1.0.148", default-features = false }
serde_yaml = "0.9.34"
similar = "3.1.2"
tokio = { version = "1.53.1", default-features = false, features = ["io-std", "io-util", "rt-multi-thread"] }
tokio-util = { version = "0.7.19", default-features = false, features = ["codec"] }
url = { version = "2.5.8", default-features = false }
