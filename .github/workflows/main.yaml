name: main

on:
  push:

jobs:
  rust-cli:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Call action
      uses: ./.github/actions/rust/cli
      with:
        dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
        dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
        ref_name: ${{ github.ref_name }}
        ref_type: ${{ github.ref_type }}
        commit_sha: ${{ github.sha }}
  shared-treesitter:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Call action
      uses: ./.github/actions/shared/treesitter
      with:
        dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
        dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
        ref_name: ${{ github.ref_name }}
  publish-release:
    runs-on: ubuntu-latest
    #if: inputs.ref_type == 'tag'
    needs:
    - rust-cli
    - shared-treesitter
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Call action
      uses: ./.github/actions/release
      with:
        dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
        dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
        ref_name: ${{ github.ref_name }}
        github_token: ${{ secrets.GITHUB_TOKEN }}
