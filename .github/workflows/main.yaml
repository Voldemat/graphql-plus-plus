name: main

on:
  push:

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      rust_cli: ${{ steps.filter.outputs.rust_cli }}
      rust_libgql: ${{ steps.filter.outputs.rust_libgql }}
      shared_treesitter: ${{ steps.filter.outputs.shared_treesitter }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Check for file changes
      id: filter
      uses: dorny/paths-filter@v4
      with:
        filters: |
          rust_libgql:
            - 'rust/libgql/**'
            - '.github/actions/rust/libgql/action.yaml'
          rust_cli:
            - 'rust/libgql/**'
            - 'rust/cli/**'
            - 'shared/dockerfiles/cli'
            - 'shared/dockerfiles/cli.dockerignore'
            - '.github/actions/rust/cli/action.yaml'
          shared_treesitter:
            - 'shared/treesitter/**'
            - 'shared/dockerfiles/treesitter'
            - 'shared/dockerfiles/treesitter.dockerignore'
            - '.github/actions/shared/treesitter/action.yaml'
  rust-cli:
    needs: check-changes
    runs-on: ubuntu-latest
    if: ${{ needs.check-changes.outputs.rust_cli == 'true' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Call action
      uses: ./.github/actions/rust/cli
      with:
        dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
        dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
        ref_name: ${{ github.ref_name }}
        ref_type: ${{ github.ref_type }}
        commit_sha: ${{ github.sha }}
  shared-treesitter:
    needs: check-changes
    runs-on: ubuntu-latest
    if: ${{ needs.check-changes.outputs.shared_treesitter == 'true' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Call action
      uses: ./.github/actions/shared/treesitter
      with:
        dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
        dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
        ref_name: ${{ github.ref_name }}
  rust-libgql:
    needs: check-changes
    runs-on: ubuntu-latest
    if: ${{ needs.check-changes.outputs.rust_libgql == 'true' }}
    permissions:
      id-token: write
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Call action
      uses: ./.github/actions/rust/libgql
      with:
        ref_name: ${{ github.ref_name }}
        ref_type: ${{ github.ref_type }}
        cargo_registry_token: ${{ steps.auth.outputs.token }}
  publish-release:
    runs-on: ubuntu-latest
    if: inputs.ref_type == 'tag'
    needs:
    - rust-cli
    - shared-treesitter
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Call action
      uses: ./.github/actions/release
      with:
        dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
        dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
        ref_name: ${{ github.ref_name }}
        github_token: ${{ secrets.GITHUB_TOKEN }}
