name: "shared treesitter"

on:
  push:
    paths:
    - shared/treesitter/**
    - .github/workflows/shared-treesitter.yaml
    - shared/dockerfiles/treesitter
    - shared/dockerfiles/treesitter.dockerignore

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build treesitter targets image
      uses: docker/build-push-action@v6
      with:
        file: shared/dockerfiles/treesitter
        push: true
        target: targets
        tags: vladimirdev635/gql-treesitter-targets:${{ github.ref_name }}
        cache-from: type=registry,ref=vladimirdev635/gql-treesitter-targets:buildcache
        cache-to: type=registry,ref=vladimirdev635/gql-treesitter-targets:buildcache,mode=max
        provenance: false
        sbom: false
