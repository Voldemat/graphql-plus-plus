name: "shared treesitter"
description: ''
inputs:
  dockerhub_username:
    description: ''
    required: true
  dockerhub_token:
    description: ''
    required: true
  ref_name:
    description: ''
    required: true

runs:
  using: 'composite'
  steps:
  - name: Checkout
    uses: actions/checkout@v4
  - name: Login to Docker Hub
    uses: docker/login-action@v3
    with:
      username: ${{ inputs.dockerhub_username }}
      password: ${{ inputs.dockerhub_token }}
  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v3
  - name: Build treesitter targets image
    uses: docker/build-push-action@v6
    with:
      file: shared/dockerfiles/treesitter
      push: true
      tags: vladimirdev635/gql-treesitter-targets:${{ inputs.ref_name }}
      cache-from: type=registry,ref=vladimirdev635/gql-treesitter-targets:buildcache
      cache-to: type=registry,ref=vladimirdev635/gql-treesitter-targets:buildcache,mode=max
      provenance: false
      sbom: false
