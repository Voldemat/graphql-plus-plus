name: "rust-libgql"
description: ""
inputs:
  ref_name:
    description: 'Ref name'
    required: true
  ref_type:
    description: 'Ref type'
    required: true

runs:
  using: 'composite'
  steps:
  - name: Build
    working-directory: rust/libgql
    shell: sh
    run: cargo build --profile release
  - name: Test
    shell: sh
    working-directory: rust/libgql
    run: cargo test --profile release --features=formatter
  - name: Get crates.io token
    if: inputs.ref_type == 'tag'
    uses: rust-lang/crates-io-auth-action@v1
    id: auth
  - name: Publish crate
    shell: sh
    if: inputs.ref_type == 'tag'
    working-directory: rust/libgql
    env:
      CARGO_REGISTRY_TOKEN: ${{ inputs.cargo_registry_token }}
    run: |
      sed -i.bak 's/^version = "0.0.1"/version = "${{ inputs.ref_name }}"/' Cargo.toml
      rm Cargo.toml.bak
      cargo check
      cargo publish --allow-dirty
