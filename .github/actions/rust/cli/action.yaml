name: "rust cli build"
description: ""
inputs:
  dockerhub_username:
    description: 'Dockerhub username'
    required: true
  dockerhub_token:
    description: 'Dockerhub token'
    required: true
  ref_name:
    description: 'Ref name'
    required: true
  ref_type:
    description: 'Ref type'
    required: true
  commit_sha:
    description: 'Commit sha'
    required: true

runs:
  using: 'composite'
  steps:
  - name: Login to Docker Hub
    uses: docker/login-action@v3
    with:
      username: ${{ inputs.dockerhub_username }}
      password: ${{ inputs.dockerhub_token }}
  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v3
  - name: Build gql targets image
    uses: docker/build-push-action@v6
    with:
      file: shared/dockerfiles/cli
      push: true
      target: targets
      tags: vladimirdev635/gql-targets:${{ inputs.ref_name }}
      cache-from: type=registry,ref=vladimirdev635/gql-targets:buildcache
      cache-to: type=registry,ref=vladimirdev635/gql-targets:buildcache,mode=max
      provenance: false
      sbom: false
      build-args: |
        CLI_VERSION=${{ case(inputs.ref_type == 'tag', inputs.ref_name, format('{0}-{1}', inputs.ref_name, inputs.commit_sha)) }}
  - name: Build gql linux x86_64
    uses: docker/build-push-action@v6
    with:
      file: shared/dockerfiles/cli
      push: true
      target: x86_64-linux-scratch
      tags: vladimirdev635/gql-linux-x86_64:${{ inputs.ref_name }}
      cache-from: type=registry,ref=vladimirdev635/gql-linux-x86_64:buildcache
      cache-to: type=registry,ref=vladimirdev635/gql-linux-x86_64:buildcache,mode=max
      provenance: false
      sbom: false
      build-args: |
        CLI_VERSION=${{ case(inputs.ref_type == 'tag', inputs.ref_name, format('{0}-{1}', inputs.ref_name, inputs.commit_sha)) }}
  - name: Build gql linux arm64
    uses: docker/build-push-action@v6
    with:
      file: shared/dockerfiles/cli
      push: true
      target: aarch64-linux-scratch
      tags: vladimirdev635/gql-linux-arm64:${{ inputs.ref_name }}
      cache-from: type=registry,ref=vladimirdev635/gql-linux-arm64:buildcache
      cache-to: type=registry,ref=vladimirdev635/gql-linux-arm64:buildcache,mode=max
      provenance: false
      sbom: false
      build-args: |
        CLI_VERSION=${{ case(inputs.ref_type == 'tag', inputs.ref_name, format('{0}-{1}', inputs.ref_name, inputs.commit_sha)) }}
  - name: Build gql linux x86_64 alpine
    uses: docker/build-push-action@v6
    with:
      file: shared/dockerfiles/cli
      push: true
      target: x86_64-alpine
      tags: vladimirdev635/gql-alpine-linux-x86_64:${{ inputs.ref_name }}
      cache-from: type=registry,ref=vladimirdev635/gql-alpine-linux-x86_64:buildcache
      cache-to: type=registry,ref=vladimirdev635/gql-alpine-linux-x86_64:buildcache,mode=max
      provenance: false
      sbom: false
      build-args: |
        CLI_VERSION=${{ case(inputs.ref_type == 'tag', inputs.ref_name, format('{0}-{1}', inputs.ref_name, inputs.commit_sha)) }}
  - name: Build gql linux arm64 alpine
    uses: docker/build-push-action@v6
    with:
      file: shared/dockerfiles/cli
      push: true
      target: aarch64-alpine
      tags: vladimirdev635/gql-alpine-linux-arm64:${{ inputs.ref_name }}
      cache-from: type=registry,ref=vladimirdev635/gql-alpine-linux-arm64:buildcache
      cache-to: type=registry,ref=vladimirdev635/gql-alpine-linux-arm64:buildcache,mode=max
      provenance: false
      sbom: false
      build-args: |
        CLI_VERSION=${{ case(inputs.ref_type == 'tag', inputs.ref_name, format('{0}-{1}', inputs.ref_name, inputs.commit_sha)) }}
  - name: Build gql darwin x86_64
    uses: docker/build-push-action@v6
    with:
      file: shared/dockerfiles/cli
      push: true
      target: x86_64-darwin-scratch
      tags: vladimirdev635/gql-darwin-x86_64:${{ inputs.ref_name }}
      cache-from: type=registry,ref=vladimirdev635/gql-darwin-x86_64:buildcache
      cache-to: type=registry,ref=vladimirdev635/gql-darwin-x86_64:buildcache,mode=max
      provenance: false
      sbom: false
      build-args: |
        CLI_VERSION=${{ case(inputs.ref_type == 'tag', inputs.ref_name, format('{0}-{1}', inputs.ref_name, inputs.commit_sha)) }}
  - name: Build gql darwin arm64
    uses: docker/build-push-action@v6
    with:
      file: shared/dockerfiles/cli
      push: true
      target: aarch64-darwin-scratch
      tags: vladimirdev635/gql-darwin-arm64:${{ inputs.ref_name }}
      cache-from: type=registry,ref=vladimirdev635/gql-darwin-arm64:buildcache
      cache-to: type=registry,ref=vladimirdev635/gql-darwin-arm64:buildcache,mode=max
      provenance: false
      sbom: false
      build-args: |
        CLI_VERSION=${{ case(inputs.ref_type == 'tag', inputs.ref_name, format('{0}-{1}', inputs.ref_name, inputs.commit_sha)) }}
  - name: Push gql
    shell: sh
    run: |
      docker manifest create vladimirdev635/gql:${{ inputs.ref_name }} \
          vladimirdev635/gql-linux-x86_64:${{ inputs.ref_name }} \
          vladimirdev635/gql-linux-arm64:${{ inputs.ref_name }} \
          vladimirdev635/gql-darwin-x86_64:${{ inputs.ref_name }} \
          vladimirdev635/gql-darwin-arm64:${{ inputs.ref_name }}
      docker manifest annotate vladimirdev635/gql:${{ inputs.ref_name }} \
          vladimirdev635/gql-linux-x86_64:${{ inputs.ref_name }} --os linux --arch=amd64
      docker manifest annotate vladimirdev635/gql:${{ inputs.ref_name }} \
          vladimirdev635/gql-linux-arm64:${{ inputs.ref_name }} --os linux --arch=arm64
      docker manifest annotate vladimirdev635/gql:${{ inputs.ref_name }} \
          vladimirdev635/gql-darwin-x86_64:${{ inputs.ref_name }} --os darwin --arch=amd64
      docker manifest annotate vladimirdev635/gql:${{ inputs.ref_name }} \
          vladimirdev635/gql-darwin-arm64:${{ inputs.ref_name }} --os darwin --arch=arm64
      docker manifest push vladimirdev635/gql:${{ inputs.ref_name }}
      docker manifest create vladimirdev635/gql-alpine:${{ inputs.ref_name }} \
          vladimirdev635/gql-alpine-linux-x86_64:${{ inputs.ref_name }} \
          vladimirdev635/gql-alpine-linux-arm64:${{ inputs.ref_name }}
      docker manifest annotate vladimirdev635/gql-alpine:${{ inputs.ref_name }} \
          vladimirdev635/gql-alpine-linux-x86_64:${{ inputs.ref_name }} --os linux --arch=amd64
      docker manifest annotate vladimirdev635/gql-alpine:${{ inputs.ref_name }} vladimirdev635/gql-alpine-linux-arm64:${{ inputs.ref_name }} --os linux --arch=arm64
      docker manifest push vladimirdev635/gql-alpine:${{ inputs.ref_name }}
  - name: 'Copy all binaries'
    shell: sh
    #if: inputs.ref_type == 'tag'
    run: |
      container_id=$(docker create --pull always vladimirdev635/gql-targets:${{ inputs.ref_name }} sh)
      docker cp $container_id:/targets ./cli-targets
      docker rm $container_id

      container_id=$(docker create --pull always vladimirdev635/gql-treesitter-targets:${{ inputs.ref_name }} sh)
      docker cp $container_id:/ ./treesitter
      docker rm $container_id

      mkdir linux-x86_64
      mkdir linux-arm64
      mkdir darwin-x86_64
      mkdir darwin-arm64

      mv ./cli-targets/x86_64-darwin ./darwin-x86_64/cli
      mv ./treesitter/x86_64-darwin ./darwin-x86_64/cli

