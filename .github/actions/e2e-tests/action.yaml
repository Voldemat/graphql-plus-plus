name: "e2e-tests"
description: ""
inputs:
  dockerhub_username:
    description: ''
    required: true
  dockerhub_token:
    description: ''
    required: true
  ref_name:
    description: ""
    required: true

runs:
  using: composite
  steps:
  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v3
  - name: Login to Docker Hub
    uses: docker/login-action@v3
    with:
      username: ${{ inputs.dockerhub_username }}
      password: ${{ inputs.dockerhub_token }}
  - name: Build e2e-tests rust-server
    uses: docker/build-push-action@v6
    with:
      file: shared/dockerfiles/e2e-tests/rust-server
      push: true
      tags: vladimirdev635/e2e-tests-rust-server:${{ inputs.ref_name }}
      cache-from: type=registry,ref=vladimirdev635/e2e-tests-rust-server:buildcache
      cache-to: type=registry,ref=vladimirdev635/e2e-tests-rust-server:buildcache,mode=max
      provenance: false
      sbom: false
  - name: Build e2e-tests typescript-client
    uses: docker/build-push-action@v6
    with:
      file: shared/dockerfiles/e2e-tests/typescript-client
      push: true
      tags: vladimirdev635/e2e-tests-typescript-client:${{ inputs.ref_name }}
      cache-from: type=registry,ref=vladimirdev635/e2e-tests-typescript-client:buildcache
      cache-to: type=registry,ref=vladimirdev635/e2e-tests-typescript-client:buildcache,mode=max
      provenance: false
      sbom: false
      build-args: |
        GQL_IMAGE_TAG=vladimirdev635/gql:${{ inputs.ref_name }}
  - name: Docker compose up
    env:
      GRAPHQL_BASE_IMAGE: vladimirdev635/gql-alpine:${{ inputs.ref_name }}
      COMPOSE_FILE: ./e2e-tests/docker-compose.yaml
      RUST_SERVER_IMAGE: vladimirdev635/e2e-tests-rust-server:${{ inputs.ref_name }}
      TYPESCRIPT_CLIENT_IMAGE: vladimirdev635/e2e-tests-typescript-client:${{ inputs.ref_name }}
      GQL_IMAGE_TAG: vladimirdev635/gql:${{ inputs.ref_name }}
    shell: sh
    run: docker compose up -d
  - name: Run typescript-client tests
    env:
      GRAPHQL_BASE_IMAGE: vladimirdev635/gql-alpine:${{ inputs.ref_name }}
      COMPOSE_FILE: ./e2e-tests/docker-compose.yaml
      RUST_SERVER_IMAGE: vladimirdev635/e2e-tests-rust-server:${{ inputs.ref_name }}
      TYPESCRIPT_CLIENT_IMAGE: vladimirdev635/e2e-tests-typescript-client:${{ inputs.ref_name }}
      GQL_IMAGE_TAG: vladimirdev635/gql:${{ inputs.ref_name }}
    shell: sh
    run: docker compose exec typescript-client bun start
  - name: Docker compose down
    if: always()
    env:
      GRAPHQL_BASE_IMAGE: vladimirdev635/gql-alpine:${{ inputs.ref_name }}
      COMPOSE_FILE: ./e2e-tests/docker-compose.yaml
      RUST_SERVER_IMAGE: vladimirdev635/e2e-tests-rust-server:${{ inputs.ref_name }}
      TYPESCRIPT_CLIENT_IMAGE: vladimirdev635/e2e-tests-typescript-client:${{ inputs.ref_name }}
      GQL_IMAGE_TAG: vladimirdev635/gql:${{ inputs.ref_name }}
    shell: sh
    run: |
      docker compose logs rust-server
      docker compose down
